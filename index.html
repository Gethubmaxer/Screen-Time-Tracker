<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenTime Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a14;
    --bg-surface: #12121f;
    --bg-card: #1a1a2e;
    --bg-card-hover: #22223a;
    --border: #2a2a42;
    --text-primary: #e8e8f0;
    --text-secondary: #9090aa;
    --text-muted: #606080;
    --accent: #5eead4;
    --accent-dim: rgba(94, 234, 212, 0.15);
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf24;
    --blue: #60a5fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px;
  }

  /* --- Layout --- */
  .container { max-width: 1200px; margin: 0 auto; }

  /* --- Header --- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .status-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 12px rgba(251, 113, 133, 0.4); }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-time {
    font-size: 14px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* --- Current Activity --- */
  .current-activity {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .current-activity::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--blue));
  }
  .current-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }
  .current-app-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .current-app-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }
  .current-window-title {
    font-size: 16px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .current-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 500;
    color: var(--accent);
    margin-left: auto;
    background: var(--accent-dim);
    padding: 6px 16px;
    border-radius: 8px;
  }
  .current-idle {
    color: var(--text-muted);
    font-size: 18px;
    font-weight: 600;
  }

  /* --- Grid --- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .grid-full { grid-column: 1 / -1; }

  /* --- Cards --- */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
  }
  .card-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  /* --- Today Stats --- */
  .stats-row {
    display: flex;
    gap: 20px;
  }
  .stat-item { flex: 1; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-number {
    font-size: 22px;
    font-weight: 700;
  }

  /* --- App List --- */
  .app-list { list-style: none; }
  .app-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .app-item:last-child { border-bottom: none; }
  .app-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .app-info { flex: 1; min-width: 0; }
  .app-info-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .app-info-time {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .app-bar-wrap {
    width: 120px;
    flex-shrink: 0;
  }
  .app-bar-bg {
    background: var(--bg-card);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
  }
  .app-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.6s ease;
  }
  .app-duration {
    font-size: 14px;
    font-weight: 600;
    width: 60px;
    text-align: right;
    flex-shrink: 0;
  }

  /* --- Timeline --- */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px; top: 4px; bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding: 8px 0 8px 16px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -21px; top: 14px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px solid var(--accent);
  }
  .timeline-app {
    font-size: 14px;
    font-weight: 600;
  }
  .timeline-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* --- Empty State --- */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-text { font-size: 15px; }

  /* --- Responsive --- */
  @media (max-width: 800px) {
    body { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .current-app-row { flex-direction: column; align-items: flex-start; }
    .current-timer { margin-left: 0; }
    .stats-row { flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="status-dot" id="statusDot"></div>
      <h1>ScreenTime</h1>
    </div>
    <div class="header-time" id="headerTime">--</div>
  </div>

  <!-- Current Activity -->
  <div class="current-activity" id="currentActivity">
    <div class="current-label">Currently Active</div>
    <div class="current-app-row">
      <span class="current-idle" id="currentAppDisplay">Waiting for data...</span>
      <span class="current-window-title" id="currentTitleDisplay"></span>
      <span class="current-timer" id="currentTimer">--</span>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Total Today</span>
      </div>
      <div class="card-value" id="totalToday">0h 0m</div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Apps Used</span>
      </div>
      <div class="card-value" id="appsCount">0</div>
    </div>
  </div>

  <!-- Today's Top Apps -->
  <div class="card grid-full" style="margin-bottom: 24px;">
    <div class="card-header">
      <span class="card-title">Today's Activity</span>
    </div>
    <ul class="app-list" id="todayList">
      <li class="empty-state">
        <div class="empty-state-icon">📊</div>
        <div class="empty-state-text">No data yet today</div>
      </li>
    </ul>
  </div>

  <!-- Recent Timeline -->
  <div class="card grid-full">
    <div class="card-header">
      <span class="card-title">Recent Timeline</span>
    </div>
    <div class="timeline" id="timeline">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <div class="empty-state-text">Waiting for activity data...</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURATION — Replace these with YOUR Supabase project values
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://civrdwybhcphwbqxsnhc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpdnJkd3liaGNwaHdicXhzbmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDY0OTYsImV4cCI6MjA5NDc4MjQ5Nn0.Knakff7i_JFnsSks9eBv8kKMKPdENn-WYo6W6uOvASo';
// ═══════════════════════════════════════════════════════════════

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  realtime: { params: { eventsPerSecond: 10 } },
});

// --- State ---
let currentActivity = null;
let activityStartTime = null;
let timerInterval = null;

// --- Formatting ---
function fmtDuration(seconds) {
  if (!seconds || seconds <= 0) return '0m';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function fmtDurationShort(seconds) {
  if (!seconds || seconds <= 0) return '0m';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function fmtTime(isoStr) {
  if (!isoStr) return '--';
  try {
    const d = new Date(isoStr);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch { return isoStr; }
}

function timeAgo(isoStr) {
  if (!isoStr) return '--';
  const now = Date.now();
  const then = new Date(isoStr).getTime();
  const diff = Math.floor((now - then) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return fmtTime(isoStr);
}

// --- App icon helper ---
function appIcon(name) {
  const icons = {
    chrome: '🌐', firefox: '🦊', edge: '🌐', brave: '🌐',
    code: '💻', 'visual studio': '💻', cursor: '💻', 'vscode': '💻',
    word: '📝', excel: '📊', powerpoint: '📽', onenote: '📓',
    outlook: '📧', teams: '💬', discord: '💬', slack: '💬',
    spotify: '🎵', youtube: '▶️', 'windows explorer': '📁',
    calculator: '🔢', terminal: '⌨️', cmd: '⌨️', powershell: '⌨️',
    chrome: '🌐',
  };
  for (const [key, icon] of Object.entries(icons)) {
    if (name.toLowerCase().includes(key)) return icon;
  }
  return '📱';
}

// --- Render Functions ---
function renderCurrentActivity(data) {
  const display = document.getElementById('currentAppDisplay');
  const title = document.getElementById('currentTitleDisplay');
  const timer = document.getElementById('currentTimer');

  if (!data || !data.app_name) {
    display.textContent = 'No activity data';
    display.className = 'current-idle';
    title.textContent = '';
    timer.textContent = '--';
    return;
  }

  if (data.app_name === 'Not running' || data.app_name === '') {
    display.textContent = '💤 System Idle / No active window';
    display.className = 'current-idle';
    title.textContent = '';
    timer.textContent = '--';
    return;
  }

  display.textContent = `${appIcon(data.app_name)} ${data.app_name}`;
  display.className = 'current-app-name';
  title.textContent = data.window_title || '';

  // Start timer counting up
  currentActivity = data;
  activityStartTime = data.started_at ? new Date(data.started_at + 'Z').getTime() : Date.now();
  if (timerInterval) clearInterval(timerInterval);
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  if (!activityStartTime) return;
  const elapsed = Math.floor((Date.now() - activityStartTime) / 1000);
  const el = document.getElementById('currentTimer');
  if (el) el.textContent = fmtDuration(elapsed);
}

function renderTodaySummary(data) {
  const list = document.getElementById('todayList');
  const totalEl = document.getElementById('totalToday');
  const countEl = document.getElementById('appsCount');

  if (!data || data.length === 0) {
    list.innerHTML = `<li class="empty-state">
      <div class="empty-state-icon">📊</div>
      <div class="empty-state-text">No data yet today</div>
    </li>`;
    totalEl.textContent = '0h 0m';
    countEl.textContent = '0';
    return;
  }

  const total = data.reduce((sum, r) => sum + (r.duration_seconds || 0), 0);
  totalEl.textContent = fmtDurationShort(total);
  countEl.textContent = data.length;

  list.innerHTML = data.map(row => {
    const dur = row.duration_seconds || 0;
    const pct = total > 0 ? (dur / total * 100) : 0;
    return `<li class="app-item">
      <div class="app-icon">${appIcon(row.app_name)}</div>
      <div class="app-info">
        <div class="app-info-name">${row.app_name}</div>
        <div class="app-info-time">${row.category || 'neutral'}</div>
      </div>
      <div class="app-bar-wrap">
        <div class="app-bar-bg">
          <div class="app-bar-fill" style="width: ${pct}%"></div>
        </div>
      </div>
      <div class="app-duration">${fmtDurationShort(dur)}</div>
    </li>`;
  }).join('');
}

function renderTimeline(data) {
  const el = document.getElementById('timeline');
  if (!data || data.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">⏳</div>
      <div class="empty-state-text">No recent activity</div>
    </div>`;
    return;
  }

  el.innerHTML = data.slice(0, 30).map(row => {
    const dur = row.duration_seconds || 0;
    return `<div class="timeline-item">
      <div class="timeline-app">${appIcon(row.app_name)} ${row.app_name}</div>
      <div class="timeline-meta">
        ${fmtTime(row.start_time)} · ${fmtDurationShort(dur)}
        ${row.window_title ? `· ${row.window_title}` : ''}
      </div>
    </div>`;
  }).join('');
}

// --- Data Fetching ---
async function fetchToday() {
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const { data, error } = await sb
      .from('activity_logs')
      .select('app_name, category, duration_seconds')
      .gte('start_time', today.toISOString())
      .order('duration_seconds', { ascending: false });

    if (error) throw error;
    renderTodaySummary(data);
    document.getElementById('statusDot').className = 'status-dot';
  } catch (e) {
    console.warn('fetchToday:', e.message);
    document.getElementById('statusDot').className = 'status-dot offline';
  }
}

async function fetchTimeline() {
  try {
    const { data, error } = await sb
      .from('activity_logs')
      .select('app_name, window_title, start_time, duration_seconds')
      .order('start_time', { ascending: false })
      .limit(30);

    if (error) throw error;
    renderTimeline(data);
  } catch (e) {
    console.warn('fetchTimeline:', e.message);
  }
}

// --- Realtime subscription for current activity ---
function subscribeCurrentActivity() {
  const channel = sb
    .channel('current-activity-changes')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'current_activity',
        filter: 'id=eq.1',
      },
      (payload) => {
        renderCurrentActivity(payload.new);
      }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        // Fetch initial data after subscribing
        fetchCurrentActivity();
      }
    });
}

async function fetchCurrentActivity() {
  try {
    const { data, error } = await sb
      .from('current_activity')
      .select('*')
      .eq('id', 1)
      .single();

    if (error) throw error;
    renderCurrentActivity(data);
  } catch (e) {
    console.warn('fetchCurrentActivity:', e.message);
  }
}

// --- Clock ---
function updateClock() {
  document.getElementById('headerTime').textContent =
    new Date().toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// --- Init ---
updateClock();
setInterval(updateClock, 30000);
fetchToday();
fetchTimeline();
subscribeCurrentActivity();

// Refresh today/timeline every 30s
setInterval(fetchToday, 30000);
setInterval(fetchTimeline, 30000);
</script>
</body>
</html>
